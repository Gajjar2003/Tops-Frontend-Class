following should be implemented:
o Change the background color of the form.
o Add padding and margins to form fields.
o Style the submit button with a hover effect.
o Use class selectors for styling common elements and ID selectors for unique
elements. -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="form-container">
        <h1 id="form-title">Contact Form</h1>
        <hr >
        <form action="">
            <label>Name</label><br>
            <input type="text" placeholder="Enter Your Name" class="form-field"><br>
            <label>Email-Id</label><br>
            <input type="email" placeholder="Enter Your Email-id" class="form-field"><br>
            <label>Message</label><br>
            <textarea name="" id="" placeholder="Enter Your Message ...." class="form-field"></textarea><br>
            <button type="submit" id="btn">Submit</button>
        </form>
    </div>
</body>

</html>
