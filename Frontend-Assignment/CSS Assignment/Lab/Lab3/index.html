<!-- Task: Create a simple webpage layout using Flexbox. The layout should include:
o A header.
o A sidebar on the left.
o A main content area in the center.
o A footer.
Additional Requirements:
o Use Flexbox to position and align the elements.
o Apply different justify-content and align-items properties to observe their effects.
o Ensure the layout is responsive, adjusting forsmaller screens -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>
    <link rel="stylesheet" href="media.css">
    <link rel="stylesheet" href="styel.css">

    
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Flexbox Webpage Layout</h1>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Sidebar</h2>

            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div>
                <h2>Main Content Area</h2>
                <p>
                    This section is aligned using Flexbox properties
                    like justify-content and align-items.
                </p>
            </div>
        </main>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Flexbox Layout Example</p>
    </footer>

</body>
</html>
