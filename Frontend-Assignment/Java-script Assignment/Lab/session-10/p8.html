<body>
    <script>
  
        let getFollowersSummary = (...followers) => {
            let total = followers.reduce((sum, count) => sum + count, 0);
            return `Total followers: ${total}`;
        };


        console.log(getFollowersSummary(300, 450, 450));
    </script>
