<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>
    <h2>Fetching Posts...</h2>

    <script>
   
        fetch("https://jsonplaceholder.typicode.com/posts")
            .then(response => response.json())
            .then(posts => {
              
                for (let i = 0; i < 5; i++) {
                    console.log(posts[i].title);
                }
            })
            .catch(error => {
                console.error("Error fetching posts:", error);
            });
    </script>
</body>
</html>
