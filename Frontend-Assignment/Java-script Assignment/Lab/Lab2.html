<!-- o Write a JavaScript program to declare variables for different data types (string, 
number, boolean, null, and undefined). 
o Log the values of the variables and their types to the console using console.log().  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
      
        let str = "Hello, JavaScript!";
        let num = 42;
        let bool = true;
        let nul = null;
        let undef;


        console.log("String:", str, typeof str);
        console.log("Number:", num, typeof num);
        console.log("Boolean:", bool, typeof bool);
        console.log("Null:", nul, typeof nul);
        console.log("Undefined:", undef, typeof undef);
    </script>
</body>
</html>
