<!DOCTYPE html>
<html>
<head>
  <title>Spotify Playlist Buttons</title>
</head>
<body>

<script>

  function createPlaylistButton(songName, themeColor) {
    let button = document.createElement("button");

    button.textContent = songName;
    button.style.backgroundColor = themeColor;
    button.style.color = "white";
    button.style.padding = "10px 20px";
    button.style.margin = "5px";
    button.style.border = "none";
    button.style.borderRadius = "5px";
    button.style.cursor = "pointer";

    return button;
  }


  document.body.appendChild(
    createPlaylistButton("Kesariya", "#1DB954")
  );

  document.body.appendChild(
    createPlaylistButton("Heeriye", "#1DB954")
  );

  document.body.appendChild(
    createPlaylistButton("Apna Bana Le", "#1DB954")
  );
</script>

</body>
</html>
