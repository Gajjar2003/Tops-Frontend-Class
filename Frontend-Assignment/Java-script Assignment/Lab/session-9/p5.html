<body>
    <script>
        function getRecentSearches() {
          
            let searches = localStorage.getItem("recentSearches");

       
            if (searches === null) {
                return [];
            }

 
            return JSON.parse(searches);
        }

      
        console.log(getRecentSearches());
    </script>
</body>
