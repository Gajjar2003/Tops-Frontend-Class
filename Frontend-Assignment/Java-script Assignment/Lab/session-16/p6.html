<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let posts = [
            { id: 1, likes: 140 },
            { id: 2, likes: 260 },
            { id: 3, likes: 90 },
            { id: 4, likes: 310 }
        ];


        let totalLikes = posts.reduce((accumulator, post) => {
            return accumulator + post.likes;
        }, 0);


        console.log("Total Likes:", totalLikes);

    </script>
</body>

</html>
