<body>
    <script>
      
let products = [
    { name: "Shoes", price: 2000, isInStock: true },
    { name: "Watch", price: 5000, isInStock: false },
    { name: "Bag", price: 1500, isInStock: true },
    { name: "Phone", price: 20000, isInStock: false }
];


let inStockProducts = products.filter(product => product.isInStock);


console.log("In-stock products:", inStockProducts);
    </script>
</body>
