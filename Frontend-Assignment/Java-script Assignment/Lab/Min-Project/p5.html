
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playlist Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background-color: #242424;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .submit-btn {
            width: 100%;
            background-color: #1db954;
            font-size: 16px;
        }

        .edit-btn {
            background-color: #007bff;
            margin-right: 8px;
        }

        .delete-btn {
            background-color: #e22134;
        }

        .playlist {
            background-color: #333;
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
        }

        .playlist h3 {
            margin: 0 0 8px;
        }

        .playlist a {
            color: #1db954;
            word-break: break-all;
        }

        .error {
            color: #ff4d4d;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎵 Playlist Manager</h1>

        <form id="playlistForm">

            <label>Playlist Name</label>

            <input
                type="text"
                id="playlistName"
                placeholder="Enter playlist name"
            >

            <label>Playlist URL</label>

            <input
                type="url"
                id="playlistUrl"
                placeholder="https://open.spotify.com/..."
            >

            <p id="error" class="error"></p>

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Add Playlist
            </button>

        </form>

        <div id="playlistList"></div>

    </div>


    <script>

        let myPlaylists =
            JSON.parse(localStorage.getItem("myPlaylists")) || [];


  
        let editIndex = null;


        const form =
            document.getElementById("playlistForm");

        const playlistName =
            document.getElementById("playlistName");

        const playlistUrl =
            document.getElementById("playlistUrl");

        const playlistList =
            document.getElementById("playlistList");

        const error =
            document.getElementById("error");

        const submitBtn =
            document.getElementById("submitBtn");


   
        function manageLink(linkObj, mode) {

            if (mode === "add") {

          
                myPlaylists.push(linkObj);

            }

            else if (mode === "edit") {

             
                myPlaylists[editIndex] = linkObj;

            }

            else {

                console.log("Invalid mode");
                return;

            }


         
            localStorage.setItem(
                "myPlaylists",
                JSON.stringify(myPlaylists)
            );


      
            displayPlaylists();
        }


     

        form.addEventListener("submit", function(event) {

            event.preventDefault();


            const name =
                playlistName.value.trim();

            const url =
                playlistUrl.value.trim();


            error.textContent = "";


   
            if (name === "") {

                error.textContent =
                    "Please enter playlist name.";

                return;
            }


            if (url === "") {

                error.textContent =
                    "Please enter playlist URL.";

                return;
            }


       
            const linkObj = {

                name: name,

                url: url

            };


            if (editIndex !== null) {

                manageLink(linkObj, "edit");

                editIndex = null;

                submitBtn.textContent =
                    "Add Playlist";

            }

   
            else {

                manageLink(linkObj, "add");

            }


            form.reset();

        });




        function displayPlaylists() {

            playlistList.innerHTML = "";


            if (myPlaylists.length === 0) {

                playlistList.innerHTML =
                    "<p>No playlists added.</p>";

                return;

            }


            myPlaylists.forEach(function(playlist, index) {

                const div =
                    document.createElement("div");

                div.className = "playlist";


                div.innerHTML = `

                    <h3>
                        ${playlist.name}
                    </h3>

                    <a
                        href="${playlist.url}"
                        target="_blank"
                    >
                        ${playlist.url}
                    </a>

                    <br><br>

                    <button
                        class="edit-btn"
                        onclick="editPlaylist(${index})"
                    >
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deletePlaylist(${index})"
                    >
                        Delete
                    </button>

                `;


                playlistList.appendChild(div);

            });

        }


        function editPlaylist(index) {

            const playlist =
                myPlaylists[index];


        
            playlistName.value =
                playlist.name;

            playlistUrl.value =
                playlist.url;


        
            editIndex = index;


       
            submitBtn.textContent =
                "Update Playlist";

        }


    

        function deletePlaylist(index) {

            myPlaylists.splice(index, 1);


          
            localStorage.setItem(
                "myPlaylists",
                JSON.stringify(myPlaylists)
            );


          
            displayPlaylists();

        }


      
        displayPlaylists();

    </script>

</body>

</html>
