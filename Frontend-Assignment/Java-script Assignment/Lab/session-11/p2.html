<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function placeOrder(item, callback) {
            setTimeout(() => {
                callback(`Your ${item} is being prepared`);
            }, 2000);
        }


        function orderStatus(message) {
            console.log(message);
        }


        placeOrder("Pizza", orderStatus);
    </script>
</body>

</html>
