<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>
    <h2>Payment Status</h2>

    <script>
        function processPayment() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("Payment successful!");
                }, 2000);
            });
        }


        processPayment()
            .then((message) => {
                console.log(message);

          
                document.body.innerHTML += `<p>${message}</p>`;
            })
            .catch((error) => {
                console.log(error);
            });
    </script>
</body>
</html>
