<!DOCTYPE html>
<html>

<head>
    <title>Flipkart Cart UI</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #cart {
            max-width: 400px;
            margin: 20px auto;
        }

        .card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #f2f2f2;
            border-radius: 6px;
        }

        .remove {
            cursor: pointer;
            color: white;
            background: red;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
        }
    </style>
</head>

<body>

    <h2>Flipkart Shopping Cart</h2>

    <div id="cart">

        <div class="card">
            <span>Phone - ₹20000</span>
            <button class="remove">X</button>
        </div>

        <div class="card">
            <span>Laptop - ₹50000</span>
            <button class="remove">X</button>
        </div>

        <div class="card">
            <span>Headphones - ₹3000</span>
            <button class="remove">X</button>
        </div>

    </div>

    <script>

        const cart = document.getElementById("cart");


        cart.addEventListener("click", function (event) {
            if (event.target.classList.contains("remove")) {

                const card = event.target.parentElement;
                card.remove();
            }
        });
    </script>

</body>

</html>
