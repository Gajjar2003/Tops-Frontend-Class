<!DOCTYPE html>
<html>

<head>
    <title>Instagram Stories - Event Delegation</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #storiesContainer {
            max-width: 400px;
            margin: 20px auto;
        }

        .story-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #f3f3f3;
            border-radius: 6px;
        }

        .remove {
            cursor: pointer;
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <h2>Instagram Stories</h2>

    <div id="storiesContainer">

        <div class="story-card">
            <span>Rahul's Story</span>
            <button class="remove">X</button>
        </div>

        <div class="story-card">
            <span>Amit's Story</span>
            <button class="remove">X</button>
        </div>

        <div class="story-card">
            <span>Neha's Story</span>
            <button class="remove">X</button>
        </div>

        <div class="story-card">
            <span>Priya's Story</span>
            <button class="remove">X</button>
        </div>

    </div>

    <script>

        const container = document.getElementById("storiesContainer");


        container.addEventListener("click", function (event) {

            if (event.target.classList.contains("remove")) {

                const storyCard = event.target.closest(".story-card");
                storyCard.remove();
            }
        });
    </script>

</body>

</html>
