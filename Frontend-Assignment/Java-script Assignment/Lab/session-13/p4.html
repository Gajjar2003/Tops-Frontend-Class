<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function checkPlaylistURL(url) {
            if (!url.startsWith("https://open.spotify.com/")) {
                throw new Error("Invalid Spotify URL");
            }
            return "Valid Spotify URL";
        }


        try {
            console.log(checkPlaylistURL("https://open.spotify.com/playlist/12345"));
            console.log(checkPlaylistURL("https://youtube.com/watch?v=abc123")); 
        } catch (error) {
            console.log(error.message);
        } finally {
            console.log("Validation complete");
        }
    </script>
</body>

</html>
