
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Restaurant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #e23744;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #c91f2c;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Add Restaurant</h1>

        <form id="restaurantForm">

            <label for="restaurantName">
                Restaurant Name
            </label>

            <input
                type="text"
                id="restaurantName"
                placeholder="Enter restaurant name"
                required
            >


            <label for="cuisine">
                Cuisine
            </label>

            <input
                type="text"
                id="cuisine"
                placeholder="e.g. Indian, Chinese, Italian"
                required
            >


            <label for="rating">
                Rating
            </label>

            <input
                type="number"
                id="rating"
                placeholder="Enter rating (1-5)"
                min="1"
                max="5"
                step="0.1"
                required
            >


            <button type="submit">
                Add Restaurant
            </button>

        </form>

    </div>


    <script>

        let restaurants = [];


  
        const form = document.getElementById("restaurantForm");


   
        form.addEventListener("submit", function(event) {

       
            event.preventDefault();


         
            const name = document.getElementById("restaurantName").value;
            const cuisine = document.getElementById("cuisine").value;
            const rating = document.getElementById("rating").value;


            const restaurant = {
                name: name,
                cuisine: cuisine,
                rating: Number(rating)
            };


   
            restaurants.push(restaurant);



            console.log(restaurants);


    
            form.reset();

        });

    </script>

</body>
</html>
