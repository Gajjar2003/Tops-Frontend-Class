<script>let followers = [];

function addFollower(name) {

  
    if (name !== null && name !== undefined && name.trim() !== "") {

        followers.push(name.trim());

        console.log("Follower added:", name);

    } else {

        console.log("Invalid follower name");

    }
}



addFollower("Jenil");    
addFollower("");         
addFollower("   ");      
addFollower(null);       
addFollower(undefined);   

console.log(followers);</script>
