<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Links</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4">
        <h2>Add Profile Link</h2>

        <form id="form">

            <input type="text" id="title" class="form-control mb-3" placeholder="Enter Title">

            <input type="text" id="url" class="form-control mb-2" placeholder="https://example.com">

            <p id="error" class="text-danger"></p>

            <button class="btn btn-primary">Add Link</button>

        </form>
    </div>

    <div class="card p-4 mt-4">
        <h3>Profile Preview</h3>

        <div id="preview"></div>

    </div>

</div>

<script>

let links = JSON.parse(localStorage.getItem("links")) || [];

showLinks();

document.getElementById("form").addEventListener("submit", function(e){

    e.preventDefault();

    let title = document.getElementById("title").value;
    let url = document.getElementById("url").value;
    let error = document.getElementById("error");

    error.innerHTML = "";

    if(!url.startsWith("https://")){
        error.innerHTML = "URL must start with https://";
        return;
    }

    links.push({
        title: title,
        url: url
    });

    localStorage.setItem("links", JSON.stringify(links));

    this.reset();

    showLinks();

});

function showLinks(){

    let output = "";

    for(let i=0; i<links.length; i++){

        output += `
        <div class="mb-2">

            <a href="${links[i].url}" target="_blank" class="btn btn-success">
                ${links[i].title}
            </a>

            <button class="btn btn-danger"
            onclick="removeLink(${i})">
            Remove
            </button>

        </div>
        `;

    }

    document.getElementById("preview").innerHTML = output;

}

function removeLink(index){

    links.splice(index,1);

    localStorage.setItem("links", JSON.stringify(links));

    showLinks();

}

</script>

</body>
</html>
