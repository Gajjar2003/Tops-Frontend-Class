<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <style>
        .box{
            height: 200px;
            width: 200px;
            position: absolute;
        }
        #box-1{
            background-color: red;
            z-index: 1;
        }
         #box-2{
            background-color:green;
            z-index: 0;
            top:150px;
            left: 50px;
        }
         #box-3{
            background-color:blue;
            z-index: -1;
            top: 200px;
            left: 100px;
        }
    </style>
</head>
<body>
    <h1>Z-index</h1>
    <div class="box" id="box-1">box1</div>
    <div class="box" id="box-2">box2</div>
    <div class="box" id="box-3">box3</div>
 
</body>
</html>
