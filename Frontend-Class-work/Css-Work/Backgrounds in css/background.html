<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backgrounds</title>
    <style>
        .img{
            border: 2px solid black;
            height: 200px;
            width: 100%;
        }
        #im{
            height: 200px;
            width: 100%;
        }

        .main{
            height: 200px;
            width: 100%;
            border: 2px solid black;
             margin-top: 20px;
        }
        .b1{
            height: 100%;
            background:linear-gradient(rgb(241, 102, 102) ,rgb(238, 238, 107),rgb(170, 234, 170));
        }
        .b2
        {    height: 100%;
            background: linear-gradient(to right, rgb(230, 108, 108), rgb(230, 230, 95), rgb(84, 237, 84));
            margin-top: 10px;
            border: 2px solid black
        }

           .b3
        {    height: 100%;
            background: linear-gradient(to left, rgb(231, 94, 94), rgb(224, 224, 63), rgb(55, 193, 55));
            margin-top: 10px;
            border: 2px solid black
        }

           .b4
        {    height: 100%;
            background: linear-gradient(to top, rgb(230, 146, 146), rgb(240, 240, 172), rgb(170, 234, 170));
            margin-top: 10px;
            border: 2px solid black
        }

             .b5
        {    height: 100%;
            background: repeating-linear-gradient(45deg, rgb(203, 83, 83), rgb(225, 225, 74), rgb(62, 219, 62));
            margin-top: 10px;
            border: 2px solid black
        }
        .b6{
            height: 100%;
            background: radial-gradient(circle, rgb(230, 92, 92), rgb(215, 215, 78), rgb(49, 169, 49));
            margin-top: 10px;
            border: 2px solid black
        }
        .b7{
            height: 100%;
            background: radial-gradient(ellipse, rgb(230, 92, 92), rgb(215, 215, 78), rgb(49, 169, 49));
            margin-top: 10px;
            border: 2px solid black
        }
       

    </style>
</head>
<body>
    <h1>Backgrounds Image</h1>
    <div class="img">
        <img src="f.jpg" alt="flower" id="im">
    </div>

    <div class="main">
        <div class="b1"></div>
        <div class="b2"></div>
        <div class="b3"></div>
         <div class="b4"></div>
        <div class="b5"></div>
        <div class="b6"></div>
        <div class="b7"></div>
      
      
    </div>
</body>
</html>
