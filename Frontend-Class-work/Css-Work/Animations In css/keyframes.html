<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keyframes</title>

    <style>
        .box {
            height: 400px;
            width: 400px;
            border: 10px solid black;
            position: relative;
          
        }

        .box-item {
            height: 100px;
            width: 100px;
            background-color: red;
            position: absolute;
            animation: myanimation 4s 5 1s;
            border-radius: 50%;
       
        }

        @keyframes myanimation {

            0% {
                top: 0px;
                left: 0px;
            }

            25% {
                top: 0px;
                left: 300px;
            }

            50% {
                top: 300px;
                left: 300px;
            }

            75% {
                top: 300px;
                left: 0px;
            }

            100% {
                top: 0px;
                left: 0px;
            }
        }
    </style>
</head>

<body>

    <h1>Keyframes Animation</h1>

    <div class="box">
        <div class="box-item"></div>
    </div>

</body>

</html>
