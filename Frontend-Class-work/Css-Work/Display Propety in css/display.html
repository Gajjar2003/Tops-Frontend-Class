<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display propety</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: red;
            margin: 20px;
            display: inline-block;
        }
        nav{
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            padding: 0px 50px;
        }
        ul li{
            width: 100px;
            display: inline-block;
            text-align: center;
        }

    </style>
</head>
<body>
    <h1>Display propety</h1>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
    <div class="box" id="box5"></div>
    <div class="box" id="box6"></div>
    <div class="box" id="box7"></div>
    <nav>
        <div>
            <label for="">JG</label>
        </div>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Blog</li>
            <li>Contact</li>
            <li>Help</li>
        </ul>
    </nav>
</body>
</html>
