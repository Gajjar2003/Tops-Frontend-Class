<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        nav {
            background-color: black;
            color: white;
            padding: 0px 50px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 80px;
        }

        .logo {
            margin-right: auto;
        }

        ul li {
            display: inline-block;
            text-align: center;
            width: 100px;
        }

     
    </style>
</head>

<body>
    <h1>Navbar</h1>
    <nav>
        <div class="logo">
            <label for="">
                JG
            </label>
        </div>
        <ul>
            <li>HOME</li>
            <li>ABOUT</li>
            <li>HELP</li>
            <li>CONTACT</li>
        </ul>
        <div class="login-logout">
            <ul>
                <li>Login</li><span>/</span>
                <li>Logout</li>
            </ul>
        </div>
    </nav>

  

   
</body>

</html>
