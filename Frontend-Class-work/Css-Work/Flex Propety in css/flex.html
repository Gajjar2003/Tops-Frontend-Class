<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .main{
            height: 450px;
            width: 500px;
            border: 3px solid black;
            padding: 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

        }
        .box{
            width: 230px;
            height: 350px;
            border: 2px solid black;

        }
        #box{
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <h1>Flex</h1>
    <div class="main">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
    
    </div>
</body>
</html>
